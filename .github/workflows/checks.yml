name: Checks

# Pages serves docs/ straight from main, and docs/ is build output — so a commit made in
# the GitHub web editor changes content/ without changing what visitors see. This
# workflow closes that gap: on main it rebuilds and commits the output, which is what
# makes "edit config.json in the browser and commit" a complete workflow.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Serialise per branch so two quick edits cannot race to publish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the publish step below, which runs on main alone.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Structural checks
        run: npm run check:html

      - name: Purpose guard
        run: npm run check:purpose

      # The sponsor-name list lives in the git-ignored secrets.local.txt, so CI can only
      # check dollar figures. Run `npm run check:confidential` locally before pushing.
      - name: Confidentiality guard (dollar figures only)
        run: npm run check:confidential

      # Only after the guards pass: never publish output that failed a check.
      - name: Publish rebuilt docs/
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "docs/ already matches content/. Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Rebuild docs/ from content/

          Automated: content/ changed, so the published output was regenerated."
          # A concurrent merge can land first; rebase onto it rather than failing.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          echo "Could not push the rebuilt docs/ after three attempts." >&2
          exit 1

      # Off main, stale output is informational: nothing deploys from a branch, and main
      # regenerates its own. Failing here would block the web-editor workflow for no gain.
      - name: Committed build is current (informational off main)
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: npm run check:build
